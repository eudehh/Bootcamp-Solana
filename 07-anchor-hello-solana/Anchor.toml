skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
hello_solana = "9eEuFs67uVeMdjE4c8pPyzD7g6o5Qyi1UfZ5Gq8sdmUc"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# anchor build emits SBPF v3, but the litesvm 0.10 this scaffold pins cannot load
# v3 and fails with InvalidAccountData in add_program. anchor passes --arch itself
# so it cannot be overridden on the command line; rebuild as v0 before testing.
test = "cargo-build-sbf --manifest-path programs/hello_solana/Cargo.toml --arch v0 --sbf-out-dir target/deploy && cargo test"

[hooks]
